[package]
license.workspace = true
name = "mirror-sandbox"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
async-trait = "0.1"
futures-util = "0.3"
hyper-util = { version = "0.1", features = ["tokio"] }
mirror-protocol = { version = "0.1.0", path = "../protocols/mirror_agent" }
prost = "0.14"
thiserror = "1"
tokio = { version = "1", features = [
  "io-util",
  "macros",
  "rt",
  "sync",
  "time",
] }
tokio-util = { version = "0.7", features = ["rt"] }
tonic = "0.14"
tonic-prost = "0.14"
tower = { version = "0.5", features = ["util"] }
uuid = "1"

[build-dependencies]
tonic-prost-build = "0.14"

[dev-dependencies]
assert_matches = "1"
pretty_assertions = "1"
tokio = { version = "1", features = ["test-util"] }
tokio-stream = "0.1"
