[package]
license.workspace = true
name = "mirror-sandboxd"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[lib]
name = "mirror_sandboxd"
path = "src/lib.rs"

[[bin]]
name = "mirror-sandboxd"
path = "src/main.rs"

[dependencies]
mirror-agent = { path = "../mirror-agent" }
mirror-protocol = { version = "0.1.0", path = "../protocols/mirror_agent" }
mirror-sandbox = { path = "../mirror-sandbox" }
nix = { version = "0.27", features = ["process", "signal"] }
prost = "0.14"
ring = "0.17"
rustix = { version = "1", features = ["fs"] }
rustls = { version = "0.23", default-features = false, features = [
  "logging",
  "ring",
  "std",
  "tls12",
] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "1"
tokio = { version = "1", features = [
  "fs",
  "io-std",
  "io-util",
  "macros",
  "net",
  "process",
  "rt",
  "signal",
  "sync",
  "time",
] }
tokio-rustls = { version = "0.26", default-features = false, features = [
  "logging",
  "ring",
  "tls12",
] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = "0.14"
url = "2"

[dev-dependencies]
assert_matches = "1"
pretty_assertions = "1"
rcgen = { version = "0.13", default-features = false, features = [
  "crypto",
  "pem",
  "ring",
] }
