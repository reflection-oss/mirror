syntax = "proto3";

// Server APIs share this schema but retain separate lifecycle and hosted-account
// services. Per-session agent interaction is defined in agent.proto.
// buf:lint:ignore DIRECTORY_SAME_PACKAGE
package mirror.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

// MirrorRPC manages session lifecycle across local and hosted implementations.
// Agent interaction belongs to AgentRPC; hosted account and access policy belong
// to MirrorRuntime. Initial scope stays on creation/forking so it is atomic with
// the new session; later scope changes belong to MirrorRuntime.
// buf:lint:ignore SERVICE_SUFFIX
service MirrorRPC {
  rpc StartSession(StartSessionRequest) returns (StartSessionResponse);
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  rpc ForkSession(ForkSessionRequest) returns (ForkSessionResponse);
  // Host-local only: fork the idle conversation and current repository files.
  rpc ForkWorkspace(ForkWorkspaceRequest) returns (ForkWorkspaceResponse);
  rpc DeleteSession(DeleteSessionRequest) returns (DeleteSessionResponse);
  rpc GetSession(GetSessionRequest) returns (GetSessionResponse);
  rpc WatchSessions(WatchSessionsRequest) returns (stream WatchSessionsResponse);
}

// MirrorRuntime manages authenticated users' resources on a hosted Mirror server.
// Connection enrollment and changes to hosted access policy belong here. Agent
// interaction and session lifecycle remain in AgentRPC and MirrorRPC, including
// initial visibility on creation/forking. Local workers do not serve this API.
// buf:lint:ignore SERVICE_SUFFIX
service MirrorRuntime {
  rpc ListWorkspaces(ListWorkspacesRequest) returns (ListWorkspacesResponse);
  rpc ListModels(ListModelsRequest) returns (ListModelsResponse);
  // Only the owner may change visibility; public sessions cannot become private.
  rpc SetSessionScope(SetSessionScopeRequest) returns (SetSessionScopeResponse);
  rpc SetSessionTitle(SetSessionTitleRequest) returns (SetSessionTitleResponse);
  rpc MarkSessionRead(MarkSessionReadRequest) returns (MarkSessionReadResponse);
  rpc EscalateSession(EscalateSessionRequest) returns (EscalateSessionResponse);
  // Continues the caller's own live private session in their direct message
  // with the Mirror Slack app and returns a link to its thread there.
  rpc ContinueSessionOnSlack(ContinueSessionOnSlackRequest) returns (ContinueSessionOnSlackResponse);
  rpc GetSessionSlackUpdates(GetSessionSlackUpdatesRequest) returns (GetSessionSlackUpdatesResponse);
  rpc StopSessionSlackUpdates(StopSessionSlackUpdatesRequest) returns (StopSessionSlackUpdatesResponse);
  rpc CreateConnection(CreateConnectionRequest) returns (CreateConnectionResponse);
  rpc ListConnections(ListConnectionsRequest) returns (ListConnectionsResponse);
  rpc CheckConnection(CheckConnectionRequest) returns (CheckConnectionResponse);
  rpc RevokeConnection(RevokeConnectionRequest) returns (RevokeConnectionResponse);
  rpc SetDefaultConnection(SetDefaultConnectionRequest) returns (SetDefaultConnectionResponse);
  rpc BeginOAuthConnection(BeginOAuthConnectionRequest) returns (BeginOAuthConnectionResponse);
  rpc WaitOAuthConnection(WaitOAuthConnectionRequest) returns (WaitOAuthConnectionResponse);
  rpc ListProviders(ListProvidersRequest) returns (ListProvidersResponse);
  // Saved agents belong to the caller; another principal's agents read as not found.
  rpc CreateAgent(CreateAgentRequest) returns (CreateAgentResponse);
  rpc GetAgent(GetAgentRequest) returns (GetAgentResponse);
  rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse);
  rpc UpdateAgent(UpdateAgentRequest) returns (UpdateAgentResponse);
  rpc DeleteAgent(DeleteAgentRequest) returns (DeleteAgentResponse);
}

service AutomationService {
  rpc CreateAutomation(CreateAutomationRequest) returns (CreateAutomationResponse);
  rpc GetAutomation(GetAutomationRequest) returns (GetAutomationResponse);
  rpc ListAutomations(ListAutomationsRequest) returns (ListAutomationsResponse);
  rpc UpdateAutomation(UpdateAutomationRequest) returns (UpdateAutomationResponse);
  rpc DeleteAutomation(DeleteAutomationRequest) returns (DeleteAutomationResponse);
  rpc RunAutomation(RunAutomationRequest) returns (RunAutomationResponse);
  rpc ListAutomationEvents(ListAutomationEventsRequest) returns (ListAutomationEventsResponse);
  rpc CreateWebhookSource(CreateWebhookSourceRequest) returns (CreateWebhookSourceResponse);
  rpc ListWebhookSources(ListWebhookSourcesRequest) returns (ListWebhookSourcesResponse);
  rpc DeleteWebhookSource(DeleteWebhookSourceRequest) returns (DeleteWebhookSourceResponse);
}

service McpGatewayService {
  rpc ListMcpServers(ListMcpServersRequest) returns (ListMcpServersResponse);
  rpc BuildMcpImage(BuildMcpImageRequest) returns (BuildMcpImageResponse);
  rpc PublishMcpServer(PublishMcpServerRequest) returns (PublishMcpServerResponse);
  rpc UnpublishMcpServer(UnpublishMcpServerRequest) returns (UnpublishMcpServerResponse);
}

enum SessionScope {
  SESSION_SCOPE_UNSPECIFIED = 0;
  SESSION_SCOPE_PRIVATE = 1;
  SESSION_SCOPE_PUBLIC = 2;
}

// Which of the caller's sessions a listing returns. Unspecified lists private
// sessions, so a client that does not ask is not handed every public automation
// run.
enum SessionScopeFilter {
  SESSION_SCOPE_FILTER_UNSPECIFIED = 0;
  SESSION_SCOPE_FILTER_PRIVATE = 1;
  SESSION_SCOPE_FILTER_PUBLIC = 2;
  SESSION_SCOPE_FILTER_ALL = 3;
}

message StartSessionRequest {
  string session_id = 1;
  // Hosted initial visibility. Unspecified defaults to private.
  SessionScope scope = 2;
  // Caller-selected repository context. Omission creates a scratch session.
  Workspace workspace = 3;
  // Starts the session in the tree of this session, which the caller owns.
  // Sessions in one tree can message each other.
  string parent_session_id = 4;
  string agent_id = 5;
}

message StartSessionResponse {
  // The tree the session belongs to; empty when it was started without a
  // parent.
  string root_session_id = 1;
}

message ForkSessionRequest {
  string source_session_id = 1;
  // Rewind immediately before a user entry; mutually exclusive with after_entry_id.
  string at_entry_id = 2;
  // Include a completed assistant response, without copying files.
  string after_entry_id = 5;
  // Optional caller UUID, retained for recovery if the response is lost.
  string session_id = 6;
  reserved 3;
  reserved "mode";
  // Initial visibility. Unspecified inherits the source scope; local workers
  // accept unspecified/private and reject public scope.
  SessionScope scope = 4;
}

message ForkWorkspaceRequest {
  string source_session_id = 1;
  // Caller-generated UUID, retained for recovery if the response is lost.
  string session_id = 2;
  // New absolute checkout root; it must not already exist.
  string directory = 3;
  string name = 4;
}

message ForkWorkspaceResponse {
  // The child working directory, preserving the source's repository-relative cwd.
  string workspace = 1;
}

message ForkSessionResponse {
  string session_id = 1;
}

message DeleteSessionRequest {
  string session_id = 1;
}

message DeleteSessionResponse {}

message ListSessionsRequest {
  uint64 offset = 1;
  uint32 limit = 2;
  SessionScopeFilter scope = 3;
}

message Session {
  string id = 1;
  SessionScope scope = 2;
  google.protobuf.Timestamp updated_at = 3;
  // The root of the session's tree; empty for a session outside any tree.
  string root_session_id = 4;
  string title = 5;
  google.protobuf.Timestamp created_at = 6;
  Principal owner = 7;
  // Direct spawning parent, distinct from the tree root; absent for roots and older servers.
  optional string parent_session_id = 8;
  SessionStatus status = 9;
  bool unread = 10;
}

enum SessionStatus {
  SESSION_STATUS_UNSPECIFIED = 0;
  SESSION_STATUS_IDLE = 1;
  SESSION_STATUS_RUNNING = 2;
  SESSION_STATUS_WAITING_FOR_APPROVAL = 3;
  SESSION_STATUS_FAILED = 4;
}

message Principal {
  string id = 1;
  string display_name = 2;
  Kind kind = 3;

  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_PERSON = 1;
    KIND_WORKLOAD = 2;
  }
}

message GetSessionRequest {
  string session_id = 1;
}

message GetSessionResponse {
  Session session = 1;
}

message ListSessionsResponse {
  repeated Session sessions = 1;
  uint64 total = 2;
}

message WatchSessionsRequest {
  string cursor = 1;
  uint32 snapshot_limit = 2;
  // Applies to the snapshot and to events. Events are filtered by a session's
  // current scope, so a session made public leaves a private watch silently.
  SessionScopeFilter scope = 3;
  // Stream one bounded storage snapshot in chunks instead of a truncated first page.
  bool complete_snapshot = 4;
}

message WatchSessionsResponse {
  string cursor = 1;
  oneof update {
    SessionSnapshot snapshot = 2;
    SessionEvent event = 3;
  }
}

message SessionSnapshot {
  repeated Session sessions = 1;
  uint64 total = 2;
  // Present for complete_snapshot; chunks share a cursor and contiguous offsets.
  optional uint64 offset = 3;
}

message SessionEvent {
  string session_id = 1;
  Session session = 2;
  google.protobuf.Timestamp occurred_at = 3;
  oneof kind {
    google.protobuf.Empty created = 4;
    google.protobuf.Empty updated = 5;
    google.protobuf.Empty deleted = 6;
    Turn turn_started = 7;
    Turn turn_completed = 8;
    Turn turn_failed = 9;
    ApprovalRequested approval_requested = 10;
    ApprovalResolved approval_resolved = 11;
  }
}

message Turn {
  string turn_id = 1;
}

message ApprovalRequested {
  string call_id = 1;
  string tool_name = 2;
}

message ApprovalResolved {
  string call_id = 1;
  bool approved = 2;
}

message StaticToken {
  string token = 1;
  optional int64 expires_at = 2;
}

message CreateConnectionRequest {
  string provider = 1;
  oneof source {
    StaticToken static_token = 2;
  }
  optional string account_identifier = 3;
}

message CreateConnectionResponse {
  string connection_id = 1;
  string account_identifier = 2;
  string display = 3;
}

message Connection {
  string id = 1;
  string provider = 2;
  string account_identifier = 3;
  string status = 4;
  bool is_default = 5;
  optional int64 expires_at = 6;
  string display = 7;
}

message CheckConnectionRequest {
  string provider = 1;
}

message CheckConnectionResponse {
  optional string account_identifier = 1;
  optional string display = 2;
}

message ListConnectionsRequest {
  uint32 offset = 1;
}

message ListConnectionsResponse {
  repeated Connection connections = 1;
  optional uint32 next_offset = 2;
}

message RevokeConnectionRequest {
  string connection_id = 1;
}

message RevokeConnectionResponse {}

message SetDefaultConnectionRequest {
  string connection_id = 1;
}

message SetDefaultConnectionResponse {}

message SetSessionScopeRequest {
  string session_id = 1;
  SessionScope scope = 2;
}

message SetSessionScopeResponse {}

message SetSessionTitleRequest {
  string session_id = 1;
  string title = 2;
}

message SetSessionTitleResponse {}

message MarkSessionReadRequest {
  string session_id = 1;
}

message MarkSessionReadResponse {}

message EscalateSessionRequest {
  string session_id = 1;
  bool escalated = 2;
}

message EscalateSessionResponse {
  google.protobuf.Timestamp escalated_at = 1;
}

message ContinueSessionOnSlackRequest {
  string session_id = 1;
}

message ContinueSessionOnSlackResponse {
  // An https Slack permalink to the session's thread in the caller's direct
  // message with the app.
  string url = 1;
}

// Reports server-owned forwarding state; it does not change the subscription.
message GetSessionSlackUpdatesRequest {
  string session_id = 1;
}
message GetSessionSlackUpdatesResponse {
  bool forwarding = 1;
  // The active subscription's Slack permalink; empty when forwarding is off.
  string url = 2;
}

message StopSessionSlackUpdatesRequest {
  string session_id = 1;
}
message StopSessionSlackUpdatesResponse {}

// Repository context selected by the caller when creating a hosted session.
message Workspace {
  string name = 1;
  string repository_url = 2;
  string revision = 3;
  string directory = 4;
}

message ListWorkspacesRequest {}
message ListWorkspacesResponse {
  repeated Workspace workspaces = 1;
}

message Model {
  string id = 1;
  string label = 2;
  string api = 3;
  uint64 context_window = 4;
  repeated string reasoning_efforts = 5;
  bool subagent_only = 6;
  bool default = 7;
  bool fast_mode = 8;
}

message ListModelsRequest {}

message ListModelsResponse {
  repeated Model models = 1;
}

// Packages files beneath /app without executing build commands or exposing registry credentials.
message BuildMcpImageRequest {
  string image_id = 1;
  string base_image = 2;
  repeated McpImageFile files = 3;
  repeated string entrypoint = 4;
}

message McpImageFile {
  string path = 1;
  bytes content = 2;
  bool executable = 3;
}

message BuildMcpImageResponse {
  string image_id = 1;
  string image = 2;
}

// Publishes an immutable OCI image privately for the authenticated caller.
// Reuse publication_id for exact retries. Images inherit no platform credentials.
message PublishMcpServerRequest {
  string publication_id = 1;
  string name = 2;
  string image = 3;
  // Empty uses the image's entrypoint; otherwise this is an argv, never a shell script.
  repeated string command = 4;
  // Empty exposes all tools the server advertises.
  repeated string tools = 5;
  // Zero uses 60 seconds; maximum 300.
  uint32 timeout_seconds = 6;
  // Omitted denies networking. Hosts and credential rules only narrow deployment policy.
  EgressProfile egress = 7;
}

message PublishMcpServerResponse {
  McpServer server = 1;
}

message UnpublishMcpServerRequest {
  string publication_id = 1;
}

message UnpublishMcpServerResponse {}

message ListMcpServersRequest {}

message ListMcpServersResponse {
  repeated McpServer servers = 1;
}

message McpServer {
  string name = 1;
  optional string provider = 2;
  optional string display_name = 3;
}

message BeginOAuthConnectionRequest {
  string provider = 1;
  optional string account_identifier = 2;
}

message BeginOAuthConnectionResponse {
  string authorization_id = 1;
  string authorization_url = 2;
}

message WaitOAuthConnectionRequest {
  string authorization_id = 1;
}

message WaitOAuthConnectionResponse {
  string connection_id = 1;
  string account_identifier = 2;
  string display = 3;
}

enum ProviderSignIn {
  PROVIDER_SIGN_IN_UNSPECIFIED = 0;
  PROVIDER_SIGN_IN_TOKEN = 1;
  PROVIDER_SIGN_IN_OAUTH = 2;
}

message ListProvidersRequest {}

message ListProvidersResponse {
  repeated Provider providers = 1;
}

message Provider {
  string name = 1;
  string display_name = 2;
  ProviderSignIn sign_in = 3;
  bool accepts_token = 4;
}

// How an agent behaves, shared by local workspaces and saved hosted agents.
// Unset fields inherit the starting client's defaults.
message AgentDefinition {
  // Field numbers match the fields `mirror.agent.v1.WorkspacePreferences`
  // held before it embedded this message, so the CLI can decode preferences
  // it saved earlier as a definition. The reserved numbers are its other
  // fields at the time.
  reserved 2, 6;

  // A level name such as `high`, or a non-negative integer token budget.
  optional string reasoning_effort = 1;
  optional string model = 3;
  optional string system_prompt = 4;
  message ToolAllowlist {
    repeated string names = 1;
  }
  // Absent inherits all tools; present selects exact executable names, and empty selects none.
  // Hosted MCP entries use mcp__<server>__<tool>, not the mcp_search/describe/call wrappers.
  // A missing selected tool fails a first session preparation instead of widening access;
  // a session resumed from history runs without it.
  optional ToolAllowlist tools_allowlist = 5;
  // A wire protocol name such as `openai-responses`. This field is not
  // supported yet for saved agents.
  optional string model_api = 7;
  // This field is not supported yet for saved agents.
  optional string model_base_url = 8;
  // "normal" (provider default) or "fast", independent of reasoning effort.
  // Persisted in local workspace preferences, but not supported yet for
  // saved hosted agents.
  optional string speed = 11;
}

// The part of a hosted server's egress policy that a saved agent's sessions
// may use. It can only narrow that policy: every host must already be allowed
// and every rule already defined, or the write is `INVALID_ARGUMENT`.
message EgressProfile {
  message Host {
    // An exact host or a `*.` suffix that the server's allowed hosts cover.
    string host = 1;
    // HTTP methods to allow, such as `GET`. Empty allows every method.
    repeated string methods = 2;
    // Paths to refuse: `/exact`, `/prefix/*` or `*/suffix`.
    repeated string deny_paths = 3;
  }
  repeated Host hosts = 1;
  // Names of the server's credential rules the agent may use.
  repeated string rules = 2;
}

message Agent {
  string id = 1;
  string name = 2;
  // Increments on every applied update; `UpdateAgent` checks it.
  uint32 revision = 3;
  AgentDefinition definition = 4;
  EgressProfile egress_profile = 5;
  repeated string egress_profile_problems = 6;
}

message CreateAgentRequest {
  string agent_id = 1;
  string name = 2;
  AgentDefinition definition = 3;
  EgressProfile egress_profile = 4;
}

message CreateAgentResponse {
  Agent agent = 1;
}

message GetAgentRequest {
  string agent_id = 1;
}

message GetAgentResponse {
  Agent agent = 1;
}

message ListAgentsRequest {
  uint64 offset = 1;
  uint32 limit = 2;
}

message ListAgentsResponse {
  // Definitions omit `system_prompt`, so a page stays small; `GetAgent`
  // returns the full definition.
  repeated Agent agents = 1;
  uint64 total = 2;
}

message UpdateAgentRequest {
  string agent_id = 1;
  // The revision the update is based on. A retry of an applied update returns
  // the agent unchanged; any other stale revision is `ABORTED`.
  uint32 expected_revision = 2;
  string name = 3;
  // Required: an omitted definition is `INVALID_ARGUMENT`, not a reset.
  AgentDefinition definition = 4;
  message RemoveEgressProfile {}
  oneof egress_profile_change {
    EgressProfile egress_profile = 5;
    RemoveEgressProfile remove_egress_profile = 6;
  }
}

message UpdateAgentResponse {
  Agent agent = 1;
}

// Deleting an agent that does not exist succeeds, so retries are safe.
message DeleteAgentRequest {
  string agent_id = 1;
}

message DeleteAgentResponse {
  repeated string disabled_automation_ids = 1;
}

message AutomationDefinition {
  optional string description = 1;
  repeated Trigger triggers = 2;
  // Events with the same value at this path run in order and share one
  // thread, e.g. `body.pull_request.number`. Unset: every event starts its
  // own thread.
  optional string group_by = 3;
  oneof task {
    string prompt_template = 4;
    SkillTask skill = 8;
  }
  // One of the owner's private sessions. Events go into it instead of a
  // thread. Only for private automations, and not together with `group_by`
  // or `workspace`.
  optional string deliver_to_session = 5;
  optional Workspace workspace = 6;
  optional AutomationReplyTarget reply_target = 7;
  optional AgentDefinition agent_configuration = 9;
}

message SkillTask {
  string skill_path = 1;
  optional string additional_instructions = 2;
}

message AutomationReplyTarget {
  string provider = 1;
  string account = 2;
  string place = 3;
  optional string thread = 4;
}

message Trigger {
  oneof kind {
    WebhookTrigger webhook = 1;
    ScheduleTrigger schedule = 2;
    ManualTrigger manual = 3;
    GitHubTrigger github = 4;
  }
}

message WebhookTrigger {
  oneof sender {
    PreconfiguredSender preconfigured = 1;
    string webhook_custom_source_id = 2;
  }
  repeated Condition conditions = 3;
}

message GitHubTrigger {
  repeated Condition conditions = 1;
}

message WebhookConditions {
  repeated Condition conditions = 1;
}

enum PreconfiguredSender {
  reserved 1;
  reserved "PRECONFIGURED_SENDER_GITHUB";
  PRECONFIGURED_SENDER_UNSPECIFIED = 0;
  PRECONFIGURED_SENDER_SLACK = 2;
  PRECONFIGURED_SENDER_PUBSUB = 3;
}

message ScheduleTrigger {
  string cron = 1;
}

message ManualTrigger {}

message Condition {
  string path = 1;
  Comparison comparison = 2;
  string value = 3;
}

enum Comparison {
  COMPARISON_UNSPECIFIED = 0;
  COMPARISON_EQUALS = 1;
  COMPARISON_NOT_EQUALS = 2;
  COMPARISON_CONTAINS = 3;
  COMPARISON_STARTS_WITH = 4;
  COMPARISON_EXISTS = 5;
}

message VerifierConfig {
  oneof kind {
    HmacSha256Verifier hmac_sha256 = 1;
  }
}

message HmacSha256Verifier {
  string signature_header = 1;
  string signature_prefix = 2;
}

message AutomationEventPayload {
  oneof kind {
    WebhookPayload webhook = 1;
    SchedulePayload schedule = 2;
    ManualPayload manual = 3;
  }
}

message WebhookPayload {
  string event_type = 1;
  map<string, string> headers = 2;
  bytes body = 3;
  string sender = 4;
}

message SchedulePayload {
  google.protobuf.Timestamp scheduled_for = 1;
}

message ManualPayload {
  string requested_by_principal_id = 1;
  google.protobuf.Struct payload = 2;
}

message Automation {
  string id = 1;
  string name = 2;
  uint32 revision = 3;
  bool enabled = 4;
  optional string agent_id = 5;
  AutomationDefinition definition = 6;
  // Only for temporary automations. Once this time passes the automation
  // starts no more runs, and `ListAutomations` leaves it out unless asked to
  // include expired automations.
  optional google.protobuf.Timestamp expires_at = 7;
  SessionScope session_scope = 8;
}

enum AutomationEventSource {
  AUTOMATION_EVENT_SOURCE_UNSPECIFIED = 0;
  AUTOMATION_EVENT_SOURCE_WEBHOOK = 1;
  AUTOMATION_EVENT_SOURCE_SCHEDULE = 2;
  AUTOMATION_EVENT_SOURCE_MANUAL = 3;
  AUTOMATION_EVENT_SOURCE_GITHUB = 4;
}

enum AutomationEventStatus {
  AUTOMATION_EVENT_STATUS_UNSPECIFIED = 0;
  AUTOMATION_EVENT_STATUS_PENDING = 1;
  AUTOMATION_EVENT_STATUS_ROUTED = 2;
  // The automation was deleted or disabled before the event was routed.
  AUTOMATION_EVENT_STATUS_DROPPED = 3;
  AUTOMATION_EVENT_STATUS_FAILED = 4;
}

message AutomationEvent {
  string id = 1;
  uint32 revision = 2;
  AutomationEventSource source = 3;
  AutomationEventStatus status = 4;
  optional string session_id = 5;
  google.protobuf.Timestamp created_at = 6;
  optional google.protobuf.Timestamp routed_at = 7;
}

message WebhookSource {
  string id = 1;
  string name = 2;
  VerifierConfig verifier = 3;
}

message CreateAutomationRequest {
  string automation_id = 1;
  string name = 2;
  optional string agent_id = 3;
  AutomationDefinition definition = 4;
  // Must be in the future; see `Automation.expires_at`. Only for temporary
  // automations.
  optional google.protobuf.Timestamp expires_at = 5;
  SessionScope session_scope = 6;
}

message CreateAutomationResponse {
  Automation automation = 1;
}

message GetAutomationRequest {
  string automation_id = 1;
}

message GetAutomationResponse {
  Automation automation = 1;
}

message ListAutomationsRequest {
  uint64 offset = 1;
  uint32 limit = 2;
  // Also lists automations whose `expires_at` has passed.
  bool include_expired = 3;
}

message ListAutomationsResponse {
  repeated Automation automations = 1;
  uint64 total = 2;
}

message UpdateAutomationRequest {
  string automation_id = 1;
  uint32 expected_revision = 2;
  bool enabled = 4;
  AutomationDefinition definition = 6;
}

message UpdateAutomationResponse {
  Automation automation = 1;
}

message DeleteAutomationRequest {
  string automation_id = 1;
}

message DeleteAutomationResponse {}

message RunAutomationRequest {
  string automation_id = 1;
  google.protobuf.Struct payload = 2;
  string request_id = 3;
}

message RunAutomationResponse {
  string automation_event_id = 1;
}

message ListAutomationEventsRequest {
  string automation_id = 1;
  uint32 limit = 2;
  uint64 offset = 3;
}

message ListAutomationEventsResponse {
  repeated AutomationEvent events = 1;
}

message CreateWebhookSourceRequest {
  string webhook_source_id = 1;
  string name = 2;
  VerifierConfig verifier = 3;
  bytes secret = 4;
}

message CreateWebhookSourceResponse {
  WebhookSource webhook_source = 1;
}

message ListWebhookSourcesRequest {}

message ListWebhookSourcesResponse {
  repeated WebhookSource webhook_sources = 1;
}

message DeleteWebhookSourceRequest {
  string webhook_source_id = 1;
}

message DeleteWebhookSourceResponse {}
