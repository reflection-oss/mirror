syntax = "proto3";

// This crate intentionally hosts per-agent and server-level APIs together.
// buf:lint:ignore DIRECTORY_SAME_PACKAGE
package mirror.agent.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "mirror/protocol/mirror.proto";

// AgentRPC exposes one immutable agent as a bidirectional session.
// buf:lint:ignore SERVICE_SUFFIX
service AgentRPC {
  // These are envelopes for every operation on the bidirectional session,
  // rather than one request and response for a unary RPC.
  // buf:lint:ignore RPC_REQUEST_STANDARD_NAME
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  rpc Session(stream ClientMessage) returns (stream SessionMessage);
  rpc GetMessages(GetMessagesRequest) returns (GetMessagesResponse);
  // Invoke a session tool with normal approvals, without starting a model turn.
  rpc CallTool(CallToolRequest) returns (CallToolResponse);
}

// Imports a completed conversation into a new private hosted session, without replaying inputs.
service PromotionService {
  rpc ValidatePromotion(ValidatePromotionRequest) returns (ValidatePromotionResponse);
  rpc PromoteSession(PromoteSessionRequest) returns (PromoteSessionResponse);
}

message ValidatePromotionRequest {
  string session_id = 1;
  string source_session_id = 2;
  mirror.v1.Workspace workspace = 3;
  repeated PromotedChat history = 4;
  PersonalContext personal_context = 5;
}

message ValidatePromotionResponse {}

message PromoteSessionRequest {
  string session_id = 1;
  string source_session_id = 2;
  mirror.v1.Workspace workspace = 3;
  repeated PromotedChat history = 4;
  PersonalContext personal_context = 5;
}

message PromotedChat {
  string id = 1;
  ChatRecord chat = 2;
  google.protobuf.Timestamp timestamp = 3;
  uint64 sequence = 4;
}

message PromoteSessionResponse {}

message CallToolRequest {
  string session_id = 1;
  string name = 2;
  string arguments = 3;
  // Per-call local selection; omission uses the active session setting.
  optional string web_provider = 4;
}

message CallToolResponse {
  string content = 1;
  bool success = 2;
  optional string display = 3;
}

message ClientMessage {
  reserved 3;

  // Client-generated durable conversation identity.
  string session_id = 1;
  // Opaque client-generated identity and idempotency key.
  string message_id = 2;

  // Daemon snapshot on the first startup message; ignored after initialization.
  PersonalContext personal_context = 17;
  // W3C `traceparent` of the client span that sent this message, so a server
  // can link the work the message causes to the client's trace. Empty when the
  // client records no trace. Never parents server spans.
  string trace_parent = 19;

  oneof payload {
    Interrupt interrupt = 4;
    CancelTask cancel_task = 5;
    HITLResponse hitl_response = 6;
    google.protobuf.Empty detach_tools = 7;
    SetApprovalMode set_approval_mode = 8;
    HostToolResult host_tool_result = 9;
    InferenceConfig set_inference_config = 10;
    AgentMessage message = 11;
    // Compact an idle conversation without adding a user message or model turn.
    google.protobuf.Empty compact = 12;
    // Local retrieval selection, independent of model inference settings.
    SetWebProvider set_web_provider = 13;
    // Ephemeral host-owned inputs; never retained in conversation history.
    McpConnections set_mcp_connections = 14;
    SetToolEnabled set_tool_enabled = 15;
    google.protobuf.Empty inspect_tools = 16;
    google.protobuf.Empty inspect_settings = 18;
  }
}

// Only personal instructions and skills belong here, never host configuration or secrets.
message PersonalContext {
  repeated InstructionFile personal_instructions = 1;
}

// Source is a display label, never a server path.
message InstructionFile {
  string source = 1;
  string content = 2;
}

// Connections and private environment inputs belong only to the execution host.
message McpConnections {
  repeated McpConnection connections = 1;
  // Reopen transports after credential changes even when declarations are unchanged.
  bool reconnect = 2;
}

message McpConnection {
  string name = 1;
  McpConnectionConfig config = 2;
  string credential_directory = 3;
  map<string, string> secrets = 4;
}

message McpConnectionConfig {
  optional string url = 1;
  optional string command = 2;
  repeated string args = 3;
  map<string, string> env = 4;
  oneof auth {
    string bearer_env_var = 5;
    McpOAuth oauth = 6;
  }
  McpToolNames enabled_tools = 7;
  optional double startup_timeout_seconds = 8;
  optional double tool_timeout_seconds = 9;
}

message McpOAuth {
  optional string credential = 1;
}

message McpToolNames {
  repeated string names = 1;
}

// Availability is independent of Ask/Auto approval and contains no credentials.
message ToolInventory {
  repeated ToolAvailability tools = 1;
}

message ToolAvailability {
  string name = 1;
  string description = 2;
  // builtin, host, or a connection name for nested MCP tools.
  string source = 3;
  optional string parent = 4;
  bool enabled = 5;
  optional string unavailable_reason = 6;
}

// Accepted only while idle; already-running background tasks are not cancelled.
message SetToolEnabled {
  string name = 1;
  bool enabled = 2;
}

message SetWebProvider {
  // One of you, tavily, or firecrawl. Never contains credentials.
  string provider = 1;
}

message InferenceConfig {
  // Empty preserves the agent service's configured model.
  string model = 1;
  optional string api = 2;
  optional string base_url = 3;
  optional string reasoning_effort = 4;
  // Unset sampling controls preserve endpoint defaults; currently Chat Completions only.
  optional double temperature = 5;
  optional double top_p = 6;
  optional int64 seed = 7;
  // A JSON object whose keys are merged into every model request after the
  // fields above, spelled as the endpoint expects them (for example
  // `{"chat_template_kwargs": {"enable_thinking": false}}`). Kept as JSON text
  // so integers reach the endpoint as integers.
  optional string extra_body = 8;
  optional uint64 context_window = 9;
}

// Stops the running turn. Inputs queued behind it are kept, and queued user
// messages immediately start the next turn.
message Interrupt {}

message CancelTask {
  string task_id = 1;
}

message HITLResponse {
  string call_id = 1;
  bool approved = 2;
  ApprovalSource source = 3;
  // Model-visible explanation for a denial; ignored for approvals or when blank.
  optional string reason = 4;
}

enum ApprovalMode {
  APPROVAL_MODE_UNSPECIFIED = 0;
  APPROVAL_MODE_AUTO = 1;
  APPROVAL_MODE_HITL = 2;
  APPROVAL_MODE_BYPASS = 3;
}

message SetApprovalMode {
  ApprovalMode mode = 1;
}

// Definitions only: tool implementations stay in the client process.
message HostToolDefinition {
  string name = 1;
  string description = 2;
  string parameters_json = 3;
  bool needs_approval = 4;
  double timeout_seconds = 5;
}

message HostToolResult {
  string call_id = 1;
  string content = 2;
  optional string display = 3;
  bool success = 4;
}

message SessionMessage {
  // Legacy transport sequence. Durable AgentMessage.sequence is authoritative,
  // while transient previews are intentionally unsequenced.
  uint64 event_id = 1 [deprecated = true];

  oneof payload {
    AgentMessage agent_message = 2;
    HITLRequest hitl_request = 3;
    HITLResolved hitl_resolved = 4;
    RuntimeDelta runtime_delta = 5;
    InputAck input_ack = 8;
    InputNack input_nack = 9;
    ReplayDone replay_done = 10;
    ToolCall host_tool_call = 11;
    // Negotiated daemon recovery: replace the display, not the worker or commands.
    ReplayStart replay_start = 12;
    // History, runtime state and pending approvals have all been replayed.
    google.protobuf.Empty state_restored = 13;
    ToolInventory tool_inventory = 14;
    SessionSettings session_settings = 15;
  }

  // Set only when `agent_message` is the authoritative end of a live stream.
  bool stream_final = 6;
  optional double tokens_per_second = 7;
}

message SessionSettings {
  optional InferenceConfig inference = 1;
  ApprovalMode approval_mode = 2;
}

message ReplayStart {
  // Read this prefix through GetMessages before applying the following tail.
  uint64 history_prefix = 1;
  // Publish history and runtime together at StateRestored; absent on older daemons.
  bool includes_runtime = 2;
  // Initial attachment merges a bounded tail; recovery still replaces the full history.
  bool tail_only = 3;
  optional uint64 next_before_sequence = 4;
}

message ReplayDone {
  string conversation_id = 1;
  uint64 dropped_entries = 2;
  bool has_user_message = 3;
}

message InputAck {
  string message_id = 1;
}

enum InputNackReason {
  INPUT_NACK_REASON_UNSPECIFIED = 0;
  INPUT_NACK_REASON_SESSION_MISMATCH = 1;
  INPUT_NACK_REASON_MESSAGE_ID_CONFLICT = 2;
  INPUT_NACK_REASON_INVALID_REQUEST = 3;
  INPUT_NACK_REASON_TARGET_NOT_FOUND = 4;
}

message InputNack {
  string message_id = 1;
  InputNackReason reason = 2;
  string error = 3;
}

message HITLRequest {
  ToolCall call = 1;
  bool always_ask = 2;
}

message HITLResolved {
  string call_id = 1;
  bool approved = 2;
}

message RuntimeDelta {
  // Present on turn_started from workers that support turn identity.
  optional string turn_id = 15;

  oneof payload {
    StreamContent stream_content = 1;
    StreamReasoning stream_reasoning = 2;
    StreamRefusal stream_refusal = 3;
    StreamToolCall stream_tool_call = 4;
    google.protobuf.Empty stream_aborted = 5;
    google.protobuf.Empty compaction_started = 6;
    ContextUsage context_usage = 7;
    TaskUpdate task_update = 8;
    google.protobuf.Empty turn_completed = 9;
    google.protobuf.Empty turn_interrupted = 10;
    TurnError turn_error = 11;
    Rewound rewound = 12;
    StreamUsage stream_usage = 13;
    google.protobuf.Empty turn_started = 14;
  }
}

message Rewound {
  string entry_id = 1;
  uint64 removed_entries = 2;
}

// Provider-reported cumulative output tokens and worker-local request elapsed time.
message StreamUsage {
  uint64 completion_tokens = 1;
  double elapsed_seconds = 2;
}

message StreamContent {
  string content = 1;
}

message StreamReasoning {
  string reasoning = 1;
}

message StreamRefusal {
  string refusal = 1;
}

message StreamToolCall {
  uint32 index = 1;
  string name = 2;
  string arguments = 3;
}

// Metadata only: prompt contents remain local to the builder.
message SystemPromptReport {
  repeated Part parts = 1;
  uint64 estimated_tokens = 2;
  repeated Part tools = 3;
  optional uint64 tool_tokens = 4;

  message Part {
    string source = 1;
    uint64 estimated_tokens = 2;
  }
}

message ContextUsage {
  uint64 tokens = 1;
  uint64 window = 2;
  optional uint64 instruction_tokens = 3;
  optional uint64 message_tokens = 4;
  optional uint64 tool_result_tokens = 5;
}

enum TaskStatus {
  TASK_STATUS_UNSPECIFIED = 0;
  TASK_STATUS_RUNNING = 1;
  TASK_STATUS_SUCCEEDED = 2;
  TASK_STATUS_FAILED = 3;
  TASK_STATUS_CANCELLED = 4;
}

message TaskUpdate {
  string id = 1;
  string tool_name = 2;
  optional string display = 3;
  TaskStatus status = 4;
  google.protobuf.Timestamp started_at = 5;
  google.protobuf.Timestamp ended_at = 6;
  bool detached = 7;
  // Display-only child events; never part of the parent's conversation history.
  repeated SessionMessage messages = 8;
}

message TurnError {
  string message = 1;
}

message GetMessagesRequest {
  string session_id = 1;
  uint64 offset = 2;
  uint32 limit = 3;
}

message GetMessagesResponse {
  repeated AgentMessage messages = 1;
  uint64 total = 2;
  bool records_turn_ends = 3;
}

// AgentMessage is one durable, append-only record in the agent trace.
message AgentMessage {
  reserved 5, 7;
  reserved "compaction";

  optional uint64 sequence = 1;
  string id = 2;
  google.protobuf.Timestamp timestamp = 3;

  oneof payload {
    ChatRecord chat = 4;
    LogRecord log = 6;
    TaskResultRecord task_result = 9;
    ExtensionRecord extension = 10;
    ContextWindowRecord context_window = 11;
    ToolApprovalRecord tool_approval = 13;
    ForkRecord fork = 15;
    TurnEndRecord turn_end = 16;
  }

  // Facts the harness records about the entry beside its content; never shown
  // to the model.
  MetadataRecord metadata = 12;

  // The inference settings used by the model call that produced this record.
  optional InferenceConfig inference = 8;

  optional string turn_id = 14;

  Sender sender = 17;
}

message Sender {
  mirror.v1.Principal principal = 1;
  oneof via {
    AutomationRun automation = 2;
    AppMessage app = 3;
    SessionInput session = 4;
  }

  message AutomationRun {
    string automation_id = 1;
    string name = 2;
    string run_id = 3;
    mirror.v1.AutomationEventSource source = 4;
  }

  message AppMessage {
    string provider = 1;
    string user_id = 2;
    string user_name = 3;
  }

  message SessionInput {
    string session_id = 1;
  }
}

// Child-local workspace fork provenance; context only, never starts a model turn.
message ForkRecord {
  string parent_session_id = 1;
  // Inclusive inherited boundary; zero for an empty parent trace.
  uint64 inherited_sequence = 2;
  string source_workspace = 3;
  string destination_workspace = 4;
}

message TurnEndRecord {
  TurnOutcome outcome = 1;
  optional string error = 2;
  // A bounded name for why a failed turn failed, such as `model_request`, for
  // grouping failures without reading `error`. Unset for other outcomes.
  optional string error_kind = 3;
}

enum TurnOutcome {
  TURN_OUTCOME_UNSPECIFIED = 0;
  TURN_OUTCOME_COMPLETED = 1;
  TURN_OUTCOME_FAILED = 2;
  TURN_OUTCOME_INTERRUPTED = 3;
}

// Approval of a model-issued action; arguments and provider payloads are never copied here.
message ToolApprovalRecord {
  string call_id = 1;
  string tool_name = 2;
  ToolApprovalOutcome outcome = 3;
  ApprovalSource source = 4;
}

enum ToolApprovalOutcome {
  reserved 4, 6;
  reserved "TOOL_APPROVAL_OUTCOME_NOT_REQUIRED", "TOOL_APPROVAL_OUTCOME_FAILED";
  TOOL_APPROVAL_OUTCOME_UNSPECIFIED = 0;
  TOOL_APPROVAL_OUTCOME_REQUESTED = 1;
  TOOL_APPROVAL_OUTCOME_APPROVED = 2;
  TOOL_APPROVAL_OUTCOME_DENIED = 3;
  TOOL_APPROVAL_OUTCOME_CANCELED = 5;
}

// How permission was granted, not the rule or arguments that matched.
enum ApprovalSource {
  APPROVAL_SOURCE_UNSPECIFIED = 0;
  APPROVAL_SOURCE_MANUAL = 1;
  APPROVAL_SOURCE_AUTOMATIC = 2;
  APPROVAL_SOURCE_NOT_REQUIRED = 3;
  APPROVAL_SOURCE_REMEMBERED_EXACT = 4;
  APPROVAL_SOURCE_REMEMBERED_PREFIX = 5;
}

message ChatRecord {
  reserved 8, 9, 12;
  reserved "rewind_to";

  oneof message {
    SystemMessage system = 1;
    UserMessage user = 2;
    AssistantMessage assistant = 3;
    ToolMessage tool = 4;
  }

  optional Usage usage = 5;
  optional string display = 6;
  bool success = 7;
  // Whether the model stopped because it reached its completion limit.
  bool truncated = 10;
  optional SamplingInfo sampling = 11;
}

message SamplingInfo {
  repeated SamplingToken input_tokens = 1;
  repeated SampledToken output_tokens = 2;
}

message SamplingToken {
  optional int64 token_id = 1;
  optional string token_str = 2;
}

message SampledToken {
  SamplingToken selected_token = 1;
  repeated Logprob logprobs = 2;
}

message Logprob {
  SamplingToken token = 1;
  double logprob = 2;
}

message SystemMessage {
  string content = 1;
}

message UserMessage {
  // The text the model receives. When `parts` is set, the agent renders it
  // from them, so every client formats quoted material the same way.
  string content = 1;
  // Local repository state captured before this input is consumed.
  optional Checkpoint checkpoint = 2;
  // Images attached to this message. The model sees them, in this order,
  // before the text.
  repeated ImageContent images = 3;
  // The message as the user composed it, when it is more than plain text.
  repeated UserMessagePart parts = 4;
  // UTF-8 documents retained separately from the authored prompt.
  repeated TextDocument documents = 5;
}

message TextDocument {
  string name = 1;
  string content = 2;
}

// One image attached to a user message, inline as encoded bytes.
message ImageContent {
  // How the message's text refers to this image, such as `[Image #1]`. The
  // model reads it beside the image. Empty when the text does not name it.
  string name = 1;
  // PNG, JPEG, GIF, or WebP bytes. The agent reads the format from the data
  // and refuses an image over 3,932,160 bytes, which base64-encodes to 5 MiB.
  bytes data = 2;
}

message UserMessagePart {
  oneof part {
    string text = 1;
    // Text the user selected from earlier output and quoted in the message.
    string quoted_selection = 2;
  }
}

message Checkpoint {
  // Absolute repository root on the machine executing the tools.
  string repository_root = 1;
  // Git HEAD or the jj working-copy commit before capture.
  // Absent when a Git repository has no commits yet.
  optional string head_commit = 2;
  string snapshot_commit = 3;
}

message AssistantMessage {
  optional string content = 1;
  repeated ToolCall tool_calls = 2;
  optional string reasoning_content = 3;
  repeated google.protobuf.Struct reasoning_details = 4;
  optional string refusal = 5;
  google.protobuf.Struct provider_fields = 6;
}

message ToolCall {
  string id = 1;
  string type = 2;
  FunctionCall function = 3;
  google.protobuf.Struct provider_fields = 4;
}

message FunctionCall {
  string name = 1;
  string arguments = 2;
}

message ToolMessage {
  string tool_call_id = 1;
  string content = 2;
  optional string name = 3;
}

// Tool and execution facts kept beside the result.
message MetadataRecord {
  // Paths the tool reported touching, relative to its workspace root, with
  // their kind. Empty when the tool has no filesystem footprint of its own.
  repeated TouchedPath touched = 1;
  // Exit code of the command the tool ran, when it ran one to completion.
  optional int32 exit_code = 2;
  // Elapsed tool invocation time, ending when its result is returned.
  optional double tool_duration_seconds = 3;
  // Whether the tool stopped its command at its time limit.
  bool timed_out = 4;
}

// A path a tool touched, reported by the tool itself.
message TouchedPath {
  // Relative to the workspace root; absolute only when the tool was allowed
  // outside the workspace.
  string path = 1;
  TouchedKind kind = 2;
}

enum TouchedKind {
  TOUCHED_KIND_UNSPECIFIED = 0;
  TOUCHED_KIND_READ = 1;
  TOUCHED_KIND_WRITE = 2;
  TOUCHED_KIND_LIST = 3;
}

message Usage {
  uint64 prompt_tokens = 1;
  uint64 completion_tokens = 2;
  uint64 cached_tokens = 3;
  uint64 cache_write_tokens = 4;
}

message ExtensionRecord {
  string extension = 1;
  string kind = 2;
  google.protobuf.Struct data = 3;
  // When present, this record projects to a user message and schedules a turn.
  optional UserMessage model_message = 4;
  // Compaction keeps the latest flagged record per extension, drops the rest.
  bool survives_compaction = 5;
}

message LogRecord {
  string level = 1;
  string text = 2;
}

message ContextWindowRecord {
  string system_prompt = 1;
  google.protobuf.Struct metadata = 2;
  optional Compaction compaction = 3;
  SystemPromptReport system_prompt_report = 4;
}

message Compaction {
  string model = 1;
  optional InferenceConfig inference = 2;
  repeated AgentMessage recent = 3;
  optional string summary = 4;
  optional Usage usage = 5;
  optional uint64 context_tokens_before = 7;
  optional uint64 context_tokens_after = 8;
}

message TaskResultRecord {
  string task_id = 1;
  string tool_name = 2;
  string content = 3;
  optional string display = 4;
  bool success = 5;
}
