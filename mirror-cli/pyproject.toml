[build-system]
# Generated modules enforce the code generator's runtime versions.
requires = ["setuptools>=77", "grpcio-tools==1.74.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mirror"
version = "0.1.2"
description = "A terminal coding agent from Reflection AI."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
dependencies = [
  "rich",
  "prompt-toolkit>=3.0.52",
  "frizbee==0.13.0",
  "pydantic",
  "pyyaml>=6.0.3",
  "grpcio>=1.74.0",
  "protobuf>=6.31.1",
  "mcp>=2",
  "httpx2>=2",
  "mcp-types>=2",
  "packaging>=26.2",
  "tree-sitter>=0.25",
  "tree-sitter-bash",
]

[project.urls]
Source = "https://github.com/reflection-oss/mirror"
Documentation = "https://github.com/reflection-oss/mirror/blob/main/mirror-cli/README.md"
Issues = "https://github.com/reflection-oss/mirror/issues"

[project.scripts]
mirror = "mirror.main:run"

[tool.setuptools.package-data]
"mirror.cli" = ["extensions/**/SKILL.md"]
"mirror.cli.extensions.voice" = ["pyproject.toml", "uv.lock", "README.md"]

[tool.uv]
cache-keys = [
  { file = "pyproject.toml" },
  { file = "setup.py" },
  { file = "LICENSE" },
  { file = "NOTICE" },
  { file = "../mirror-agent/LICENSE" },
  { file = "../mirror-agent/NOTICE" },
  { file = "../mirror-agent/RIPGREP-LICENSE-MIT" },
  { file = "src/**/*.py" },
  { file = "../mirror-*/python/mirror_transcript/*.py" },
  { file = "../mirror-transcript/python/mirror_transcript/py.typed" },
  { file = "../mirror-transcript/pyproject.toml" },
  { file = "../mirror-transcript/LICENSE" },
  { file = "../mirror-transcript/transcript.proto" },
  { file = "mirror-*/python/mirror_transcript/*.py" },
  { file = "mirror-transcript/python/mirror_transcript/py.typed" },
  { file = "mirror-transcript/pyproject.toml" },
  { file = "mirror-transcript/LICENSE" },
  { file = "mirror-transcript/transcript.proto" },
  { file = "extensions/**/*.py" },
  { file = "extensions/**/pyproject.toml" },
  { file = "extensions/**/uv.lock" },
  { file = "src/**/SKILL.md" },
  # Unlike globs, explicit files tolerate the absent checkout/sdist layout.
  { file = "protos/agent.proto" },
  { file = "protos/daemon.proto" },
  { file = "protos/mirror.proto" },
  { file = "../protocols/mirror_agent/protos/agent.proto" },
  { file = "../protocols/mirror_agent/protos/daemon.proto" },
  { file = "../protocols/mirror_agent/protos/mirror.proto" },
  { env = "MIRROR_BUILD_RUST_WORKER" },
  { env = "MIRROR_WHEEL_PLATFORM" },
  { env = "MIRROR_THIRD_PARTY_NOTICES" },
  { env = "MIRROR_BUILD_SANDBOXD" },
  { env = "MIRROR_BUILD_DAEMON" },
  { env = "MIRROR_BUILD_TRANSCRIPT" },
]

[dependency-groups]
dev = [
  "pyright[nodejs]",
  "pytest",
  "pytest-asyncio",
  "pytest-xdist",
  "freezegun",
  "pyte",
  "hypothesis>=6.170.15",
]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
markers = [
  "no_xdist: runs in ci.sh's serial pass, alone, because its timing bounds miss under xdist",
]

[tool.ruff]
target-version = "py312"
line-length = 80
indent-width = 2

[tool.ruff.format]
quote-style = "single"
preview = true
